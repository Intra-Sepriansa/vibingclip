  <circle cx="90" cy="20" r="4" fill="#94A3B8" opacity="0.6"/>
  <circle cx="150" cy="20" r="4" fill="#94A3B8" opacity="0.6"/>
  <circle cx="210" cy="20" r="4" fill="#94A3B8" opacity="0.6"/>
  <circle cx="270" cy="20" r="4" fill="#94A3B8" opacity="0.6"/>
