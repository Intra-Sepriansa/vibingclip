<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pulse">
  <defs>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#0B1120"/>
  <circle cx="60" cy="60" r="18" fill="url(#pulse)">
    <animate attributeName="r" values="16;22;16" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="30" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="20;44;20" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.1;0.65" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.35">
    <animate attributeName="r" values="30;56;30" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.05;0.45" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
